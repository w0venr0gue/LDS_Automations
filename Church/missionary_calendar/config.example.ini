; Copy this file to config.ini and fill in your values.
; config.ini is ignored by git, so the token, password and email addresses never get pushed to GitHub.

[calendly]
; Calendly > Integrations > API & Webhooks. Needs only the users:read and scheduled_events:read scopes.
token = paste-your-token-here

[email]
; Gmail account the summary is sent from. app_password is a Gmail App Password
; (Google Account > Security > 2-Step Verification > App passwords), not the normal password.
sender = someone@gmail.com
app_password =
smtp_server = smtp.gmail.com
smtp_port = 465

[missionaries]
; One line per missionary: Name = email, phone (phone is optional and shown in family reminders).
; Edit this list when transfers happen.
Elder Example = elder.example@missionary.org, 410-555-0100

[reminders]
; Optional note added to the end of each family reminder. Indent extra lines to continue it.
message = Please let the missionaries know if your plans change.

[schedule]
; Day and time the weekly update runs. The change alert only watches appointments
; from now until that run, since the weekly email covers everything after.
weekly_day = Sunday
; Time the weekly update runs (24-hour HH:MM). Must match the weekly cron job.
weekly_time = 20:00

[testing]
; test_mode = on sends every email to test_email instead of the real recipients.
; Subjects and contents are exactly as in production; the To name shows who it would have gone to.
; Set test_mode = off to start sending to the missionaries and families.
test_mode = on
test_email = you@example.com
